<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus - Login</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-box glassmorphism">
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Login to your Nexus account</p>
      
      <form id="login-form">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" class="input-field" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="input-field" required>
        </div>
        <p id="error-msg" class="error-msg"></p>
        <button type="submit" class="btn-primary full-width">Sign In</button>
      </form>
      <p class="auth-redirect">Don't have an account? <a href="register.html">Sign up</a></p>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');

      try {
        const res = await fetch('http://localhost:4000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        
        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = 'index.html';
        } else {
          errorMsg.textContent = data.error || 'Login failed';
        }
      } catch (err) {
        errorMsg.textContent = 'Server error. Please try again.';
      }
    });
  </script>
</body>
</html>
